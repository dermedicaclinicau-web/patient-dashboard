<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dermedica Staff Portal</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- Shown briefly while Firebase checks if someone is already logged in -->
  <div id="boot-view" class="boot-view"><div class="spinner"></div></div>

  <!-- ============ LOGIN ============ -->
  <section id="login-view" class="login-view" hidden>
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">D</div>
        <h1>Dermedica</h1>
        <p class="muted">Staff Portal</p>
      </div>

      <p class="login-prompt">Enter your PIN</p>
      <div id="pin-dots" class="pin-dots" aria-label="PIN entry"></div>
      <p id="login-error" class="login-error" role="alert"></p>

      <div id="keypad" class="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key alt" data-key="clear">Clear</button>
        <button class="key" data-key="0">0</button>
        <button class="key alt" data-key="back" aria-label="Delete">⌫</button>
      </div>
      <p class="muted small">Tap the keypad or type on your keyboard</p>
    </div>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <div id="dashboard-view" hidden>
    <header class="topbar">
      <h1>Dermedica Portal</h1>
      <div class="staff-chip">
        <div class="avatar">
          <span id="staff-initials"></span>
          <img id="staff-photo" alt="" referrerpolicy="no-referrer" hidden />
        </div>
        <div class="staff-info">
          <strong id="staff-name"></strong>
          <span id="staff-role"></span>
        </div>
        <button id="logout-btn" class="logout-btn">Log out</button>
      </div>
    </header>

    <main class="container">
      <div id="error-banner" class="error" hidden>
        Couldn't load appointments. Please refresh the page.
      </div>

      <p class="patient-line">Patient: <strong id="patient-name">…</strong></p>

      <section class="summary">
        <div class="card">
          <span class="label">Upcoming</span>
          <span class="value" id="upcoming-count">–</span>
        </div>
        <div class="card">
          <span class="label">Past visits</span>
          <span class="value" id="past-count">–</span>
        </div>
        <div class="card wide">
          <span class="label">Next appointment</span>
          <span class="value small" id="next-appointment">–</span>
        </div>
      </section>

      <nav class="tabs" role="tablist">
        <button class="tab active" role="tab" aria-selected="true" data-target="upcoming-panel">Upcoming</button>
        <button class="tab" role="tab" aria-selected="false" data-target="past-panel">History</button>
      </nav>

      <section id="upcoming-panel" class="panel">
        <ul id="upcoming-list" class="appt-list"><li class="empty">Loading…</li></ul>
      </section>
      <section id="past-panel" class="panel" hidden>
        <ul id="past-list" class="appt-list"><li class="empty">Loading…</li></ul>
      </section>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
