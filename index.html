<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dermedica Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- Shown briefly while Firebase checks if someone is already logged in -->
  <div id="boot-view" class="boot-view"><div class="spinner"></div></div>

  <!-- ============ LOGIN ============ -->
  <section id="login-view" class="login-view" hidden>
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="gemOuter" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
            </linearGradient>
            <linearGradient id="gemInner" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
          <polygon points="14,10 50,10 60,24 32,58 4,24" fill="url(#gemOuter)"/>
          <polygon points="4,24 60,24 32,58" fill="url(#gemInner)" opacity=".9"/>
          <polygon points="22,10 42,10 46,24 18,24" fill="#bae6fd" opacity=".85"/>
          <polygon points="18,24 46,24 32,58" fill="#60a5fa" opacity=".85"/>
        </svg>
      </div>

      <h1 class="login-title">Dermedica Team</h1>
      <p class="login-sub">Welcome back! Please enter your PIN.</p>

      <form id="login-form" class="login-form" autocomplete="off" novalidate>
        <div class="pin-field">
          <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
                 autocomplete="off" maxlength="8" placeholder="••••"
                 aria-label="PIN" aria-describedby="login-error" />
          <button type="button" id="pin-toggle" class="pin-toggle" aria-label="Show PIN">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p id="login-error" class="login-error" role="alert"></p>
        <button type="submit" id="login-btn" class="login-btn">Login</button>
      </form>

      <p class="login-help">Contact Admin if you forgot your PIN.</p>
    </div>
    <p class="login-footer">Dermedica Team App V2</p>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <div id="dashboard-view" class="app-shell" hidden>

    <header class="topbar">
      <div class="brand-inline">
        <div class="brand-mark sm">D</div>
        <span class="brand-name">Dermedica</span>
      </div>

      <div class="topbar-right">
        <div class="greeting">
          <span class="greeting-text">Welcome, <strong id="staff-name"></strong></span>
          <span class="greeting-role" id="staff-role"></span>
        </div>
        <div class="avatar">
          <span id="staff-initials"></span>
          <img id="staff-photo" alt="" referrerpolicy="no-referrer" hidden />
        </div>
        <button id="edit-profile-btn" class="icon-btn" title="Edit profile" aria-label="Edit profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button id="logout-btn" class="btn-ghost sm">Log out</button>
      </div>
    </header>

    <div id="rec-bar" class="rec-bar" hidden></div>

    <div class="shell-body">
      <nav class="sidebar" aria-label="Main">
        <a href="#/patients" class="nav-item" data-page="patients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Patient List</span>
        </a>
        <a href="#/calendar" class="nav-item" data-page="calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Calendar</span>
        </a>
      </nav>

      <main id="content" class="content"></main>
    </div>

    <dialog id="profile-dialog" class="dialog">
      <form id="profile-form" class="dialog-body">
        <h2>Edit profile</h2>
        <label class="field">
          <span>Display name</span>
          <input id="profile-name" maxlength="60" required autocomplete="name" />
        </label>
        <p id="profile-error" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" id="profile-cancel" class="btn-ghost">Cancel</button>
          <button type="submit" id="profile-save" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

  </div> <!-- end dashboard-view -->

  <script type="module" src="./js/app.js"></script>
</body>
</html>
