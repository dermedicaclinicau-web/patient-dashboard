<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Dermedica</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.pf-body { margin: 0; background: #f1f5f9; color: #1e293b; font-family: Arial, Helvetica, sans-serif; }
    .pf { max-width: 860px; margin: 0 auto; padding: 16px 12px 48px; }
    .pf-sheet { margin: 0 auto; }
    .pf-state { max-width: 460px; margin: 12vh auto 0; padding: 28px 30px; background: #fff; border-radius: 14px; text-align: center; line-height: 1.55; }
    .pf-state h1 { margin: 0 0 8px; font-size: 20px; color: #0f172a; }
    .pf-state p { margin: 0 0 8px; color: #475569; }
    .pf-hi { margin: 0 0 12px; padding: 12px 16px; border-radius: 12px; background: #fff; color: #334155; line-height: 1.5; }
    .pf-test { margin: 0 0 12px; padding: 10px 14px; border: 1px dashed #f59e0b; border-radius: 10px; background: #fffbeb; color: #92400e; font-size: 14px; }
    .pf-foot { position: sticky; bottom: 0; margin: 16px 0 0; padding: 14px 16px; background: #fff; border-radius: 14px;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, .08); text-align: center; }
    .pf-send { width: 100%; max-width: 360px; padding: 14px 20px; border: 0; border-radius: 10px; background: #0f766e; color: #fff;
      font-size: 16px; font-weight: bold; cursor: pointer; }
    .pf-send:disabled { opacity: .55; cursor: default; }
    .pf-msg { margin: 0 0 10px; color: #b91c1c; font-size: 14px; }
    .pf-msg:empty { display: none; }
    .pf-privacy { margin: 10px 0 0; color: #64748b; font-size: 12px; }
    .pf .is-livehide { display: none !important; }
  </style>
</head>
<body class="pf-body">
  <main class="pf" id="pf"><div class="pf-state"><p>Loading your form…</p></div></main>
  <script type="module" src="js/public-form.js"></script>
</body>
</html>
